<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Panel | Blue</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="theme-blue">
    <!-- Animation Container -->
    <div id="animationContainer">
        <div id="ball"></div>
        <div id="animText">SIXER!</div>
        <div id="confettiContainer"></div>
    </div>

    <div id="logo">
        <img src="assets/images/logo.png" alt="Logo">
    </div>

    <div class="panel">
        <div class="p-left">
            <img src="assets/images/pakistan_flag.png" alt="Left Flag">
        </div>
        <div class="p-mid">
            <div class="players">
                <p>Striker</p>
                <p>Non-Striker</p>
            </div>
            <div class="run">
                <p><b>12 <small>2</small></b></p>
                <p><b>0 <small>0</small></b></p>
            </div>
            <div class="ining">
                <p>
                    PAK v <span id="opponent">IND</span>
                    <span id="run-wicket">12-0</span>
                    <span id="p2">P2</span>
                    <span id="over">0.2</span>
                    <span id="match">Marhaba Stadium</span>
                </p>
            </div>
            <div class="balls">
                <p class="bowler">Shafi</p>
                <div class="move">
                    <div class="circle">6</div>
                    <div class="circle">6</div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
            </div>
        </div>
        <div class="p-right">
            <img src="assets/images/indian_flag.png" alt="Right Flag">
        </div>
    </div>
    <script src="assets/script.js"></script>
</body>

</html>
