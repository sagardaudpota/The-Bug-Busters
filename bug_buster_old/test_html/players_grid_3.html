<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Team Grid</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>

    body {
      background: transparent;
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      position: relative;
      color: #fff;
    }
    /* A subtle dark overlay for better readability */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      /* background: rgba(0,0,0,0.6); */
      z-index: 0;
    }
    .team-container {
      position: relative;
      z-index: 1;
      margin: 100px auto;
      max-width: 1200px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #03e201;
      border-radius: 20px;
      padding: 30px 40px;
      box-shadow: 0 0 30px rgba(3, 226, 1, 0.8);
    }
    .team-header {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 30px;
      color: #03e201;
      text-transform: uppercase;
    }
    .player-card {
      background: #1a1a1a;
      border: 1px solid #03e201;
      border-radius: 15px;
      text-align: center;
      padding: 20px 10px;
      margin-bottom: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .player-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(3, 226, 1, 0.6);
    }
    .player-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #03e201;
      margin-bottom: 15px;
      object-fit: cover;
    }
    .player-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
    }
    @media (max-width: 576px) {
      .team-container {
        margin: 20px;
        padding: 20px;
      }
      .team-header {
        font-size: 2rem;
      }
      .player-card {
        padding: 15px 5px;
      }
      .player-img {
        width: 80px;
        height: 80px;
      }
      .player-name {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="team-container">
    <div class="team-header">Tando Jam Royals C C</div>
    <div class="row g-4 justify-content-center">
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Shahzaib Memon">
          <div class="player-name">Shahzaib</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Hasnain Talpur">
          <div class="player-name">Hasnain Talpur</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="AR Shah">
          <div class="player-name">AR Shah</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="M Farhan">
          <div class="player-name">M Farhan</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="M Asif">
          <div class="player-name">M Asif</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Azam Baloch">
          <div class="player-name">Azam Baloch</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Qasim Ali (C)">
          <div class="player-name">Qasim Ali (C)</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Zaman Tjm">
          <div class="player-name">Zaman Tjm</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Muhammad Ayan">
          <div class="player-name">Ayan</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Akbar Gurbaz">
          <div class="player-name">Akbar Gurbaz</div>
        </div>
      </div>
      <div class="col-3 col-md-2">
        <div class="player-card">
          <img class="player-img" src="https://static.vecteezy.com/system/resources/thumbnails/001/840/612/small/picture-profile-icon-male-icon-human-or-people-sign-and-symbol-free-vector.jpg" alt="Rajab">
          <div class="player-name">Rajab</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
